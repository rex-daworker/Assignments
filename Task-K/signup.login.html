<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoRide | Sign Up & Log In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans text-gray-800">

  <!-- HEADER -->
  <header class="bg-white shadow-md fixed top-0 left-0 w-full z-20">
    <div class="max-w-6xl mx-auto flex justify-between items-center p-4">
      <h1 class="text-2xl font-bold text-green-600">EcoRide</h1>
      <nav class="hidden md:flex space-x-6">
        <a href="index.html" class="hover:text-green-600">Home</a>
        <a href="catalog.html" class="hover:text-green-600">Catalog</a>
        <a href="signup-login.html" class="hover:text-green-600">Sign Up / Log In</a>
      </nav>
    </div>
  </header>

  <!-- MAIN SECTION -->
  <main class="mt-20 min-h-screen flex items-center justify-center bg-gradient-to-br from-green-700 via-blue-700 to-green-800 p-6">

    <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl grid md:grid-cols-2 overflow-hidden">

      <!-- SIGN UP FORM -->
      <div class="p-8">
        <h2 class="text-2xl font-bold text-green-700 mb-6">Sign Up</h2>
        <form action="#" method="post" class="space-y-4">
          <div>
            <label for="signup-name" class="block text-sm font-medium text-gray-700">Full Name</label>
            <input type="text" id="signup-name" name="name" required class="mt-1 w-full border rounded-lg px-3 py-2 focus:ring-green-500 focus:border-green-500">
          </div>
          <div>
            <label for="signup-email" class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" id="signup-email" name="email" required class="mt-1 w-full border rounded-lg px-3 py-2 focus:ring-green-500 focus:border-green-500">
          </div>
          <div>
            <label for="signup-password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="signup-password" name="password" required class="mt-1 w-full border rounded-lg px-3 py-2 focus:ring-green-500 focus:border-green-500">
          </div>
          <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">Create Account</button>
        </form>
      </div>

      <!-- LOG IN FORM -->
      <div class="p-8 bg-gray-50">
        <h2 class="text-2xl font-bold text-blue-700 mb-6">Log In</h2>
        <form action="#" method="post" class="space-y-4">
          <div>
            <label for="login-email" class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" id="login-email" name="email" required class="mt-1 w-full border rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div>
            <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="login-password" name="password" required class="mt-1 w-full border rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">Log In</button>
        </form>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-gray-300 py-10">
    <div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-8 px-4 text-center md:text-left">
      <div>
        <h3 class="text-xl font-bold mb-2 text-white">EcoRide</h3>
        <p>Empowering greener journeys through smarter bike rentals.</p>
      </div>
      <div>
        <h4 class="font-semibold mb-2 text-white">Quick Links</h4>
        <ul class="space-y-1">
          <li><a href="index.html" class="hover:text-green-500">Home</a></li>
          <li><a href="catalog.html" class="hover:text-green-500">Catalog</a></li>
          <li><a href="signup-login.html" class="hover:text-green-500">Sign Up / Log In</a></li>
        </ul>
      </div>
      <div>
        <h4 class="font-semibold mb-2 text-white">Contact</h4>
        <p>Email: support@ecoride.com</p>
        <p>Phone: +358 123 456 789</p>
      </div>
    </div>
    <p class="text-center text-sm mt-10">&copy; 2025 EcoRide. All rights reserved.</p>
  </footer>

</body>
</html>
